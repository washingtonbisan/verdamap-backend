# =============================================================================
# VerdaMap — Docker Compose (local development)
# =============================================================================
# Starts a PostgreSQL database for local development.
# Run: docker compose up -d
# Stop: docker compose down

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: verdamap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: verdamap
      POSTGRES_PASSWORD: verdamap
      POSTGRES_DB: verdamap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdamap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
